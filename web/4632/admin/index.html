<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090d0c">
  <title>Haan · Operations</title>
  <link rel="stylesheet" href="../../fonts.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="route" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="app">
    <section id="login" class="login card">
      <h1>Keep the city <em>moving.</em></h1>
      <p id="login-intro">Sign in to review rides, riders, promotions and support.</p>
      <form id="login-form">
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <label>Authenticator code<input type="text" name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
        <button class="primary" type="submit">Enter operations →</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
      <small>Private access · password + authenticator</small>
    </section>
    <section id="console" hidden>
      <header>
        <div><span class="brand">HAAN<span class="brand-dot">.</span></span><span class="eyebrow">KOLKATA / OPERATIONS</span></div>
        <div class="header-actions"><span id="identity"></span><button id="lang" class="ghost" type="button">हिन्दी</button><button id="theme" class="ghost" type="button">Light</button><button id="logout" class="ghost" type="button">Sign out</button></div>
      </header>
      <div class="layout">
        <nav aria-label="Operations">
          <button data-view="dashboard" class="active"><span>Overview</span></button>
          <button data-view="riders"><span>Riders</span></button>
          <button data-view="trips"><span>Trips</span></button>
          <button data-view="scheduled"><span>Scheduled</span></button>
          <button data-view="users"><span>Users</span></button>
          <button data-view="tickets"><span>Support</span></button>
          <button data-view="promotions"><span>Promotions</span></button>
          <button data-view="redemptions"><span>Subsidies</span></button>
          <button data-view="fares"><span>Fares</span></button>
          <button data-view="quotas"><span>Quotas</span></button>
          <button data-view="audit"><span>Audit</span></button>
          <button data-view="agents"><span>Agents</span></button>
        </nav>
        <div class="workspace">
          <div class="mast"><div><h2 id="section-title">Overview</h2><span id="section-kicker" class="eyebrow">LIVE PILOT</span></div><span id="clock"></span></div>
          <div id="notice" role="status"></div>
          <div id="content" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>
  <dialog id="detail"><form method="dialog"><button class="close" aria-label="Close" type="submit">×</button></form><div id="detail-content"></div></dialog>
  <script type="module" src="./admin.js"></script>
</body>
</html>
