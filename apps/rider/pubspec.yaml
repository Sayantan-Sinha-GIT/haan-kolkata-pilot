name: haan_rider
description: Haan rider Android app.
publish_to: none
version: 1.0.9+10
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  haan_core:
    path: ../haan_core
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  url_launcher: ^6.3.2
  vibration: ^3.1.4
  qr_flutter: ^4.1.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
dependency_overrides:
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
