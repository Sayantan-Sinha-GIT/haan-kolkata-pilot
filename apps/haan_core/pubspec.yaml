version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  firebase_messaging: ^15.2.10
  firebase_core: ^3.15.2
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
