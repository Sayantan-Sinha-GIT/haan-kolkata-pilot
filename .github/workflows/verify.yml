name: Verify Haan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_apks:
        description: Build signed APKs using repository secrets
        type: boolean
        default: false
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test --workspace worker
      - run: cd worker && npx wrangler deploy --dry-run
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, rider]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Analyze shared core
        working-directory: apps/haan_core
        run: flutter pub get && flutter analyze --no-fatal-infos lib && flutter test
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos lib
      - name: Build test APK
        if: ${{ !inputs.release_apks }}
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Prepare release signing
        if: ${{ inputs.release_apks }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HAAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HAAN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.HAAN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          mkdir -p secrets
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > secrets/haan-release.jks
          cat > apps/${{ matrix.app }}/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=haan
          storeFile=${{ github.workspace }}/secrets/haan-release.jks
          EOF
      - name: Build signed arm64 APK
        if: ${{ inputs.release_apks }}
        working-directory: apps/${{ matrix.app }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CUSTOMER_FIREBASE_APP_ID: ${{ vars.CUSTOMER_FIREBASE_APP_ID }}
          RIDER_FIREBASE_APP_ID: ${{ vars.RIDER_FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=DOWNLOAD_URL="$DOWNLOAD_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_APP_ID="${{ matrix.app == 'customer' && vars.CUSTOMER_FIREBASE_APP_ID || vars.RIDER_FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release_apks }}
        with:
          name: haan-${{ matrix.app }}-signed-apks
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
